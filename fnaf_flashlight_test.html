<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FNAF — тест фонарика</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;font-family:Arial,sans-serif;color:#fff;touch-action:none}
  #game{position:fixed;inset:0}
  #hud{position:fixed;inset:0;pointer-events:none}
  .top{position:absolute;top:12px;left:12px;padding:8px 12px;background:#0009;border:1px solid #ffffff35;border-radius:10px;font-size:13px}
  .hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:8px 12px;background:#0009;border-radius:10px;font-size:12px;white-space:nowrap}
  button{pointer-events:auto;border:1px solid #ffffff70;background:#111d;color:white;border-radius:14px;padding:14px 18px;font-weight:bold;font-size:14px}
  #toggle{position:absolute;right:16px;bottom:18px;min-width:132px}
  #pickup{position:absolute;left:16px;bottom:18px}
  #cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;color:#ffffff8a}
  #status{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;color:#ddd;background:#0009;padding:7px 10px;border-radius:8px;white-space:nowrap}
  @media (orientation:portrait){#game:after{content:"Поверни телефон горизонтально";position:fixed;inset:0;background:#080b12ee;display:grid;place-items:center;font-size:22px;text-align:center;padding:25px;z-index:9}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="top">FNAF • ТЕСТ ФОНАРИКА<br><span id="battery">Энергия: 100%</span></div>
  <div class="hint">Веди пальцем по экрану, чтобы осмотреться</div>
  <div id="cross">＋</div>
  <button id="pickup">ВЗЯТЬ ФОНАРИК</button>
  <button id="toggle">ВКЛЮЧИТЬ</button>
  <div id="status">Фонарик лежит на столе</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const host=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080b12);
scene.fog=new THREE.Fog(0x080b12,7,24);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,80);
camera.position.set(0,1.65,5.7);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9aa8c8,0x17121a,.48));
const ceiling=new THREE.PointLight(0x8795b5,1.0,12);ceiling.position.set(0,3.7,0);scene.add(ceiling);

const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(18,18),mat(0x24252b));floor.rotation.x=-Math.PI/2;floor.position.y=0;floor.receiveShadow=true;scene.add(floor);
function wall(w,h,d,x,y,z,color=0x30333c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.receiveShadow=true;scene.add(m);return m}
wall(18,4,.35,0,2,-5);wall(.35,4,10,-9,2,0);wall(.35,4,10,9,2,0);
wall(5,4,.25,-6.5,2,0);wall(5,4,.25,6.5,2,0);
// wall panels and warning stripe
for(let i=-7;i<=7;i+=2){wall(.06,2.8,.04,i,2,-4.78,0x555967)}
const desk=wall(3.8,.18,1.2,0,.95,2.5,0x4a3024);desk.position.y=.95;
const legs=mat(0x17191f);
for(const x of [-1.65,1.65])for(const z of [2.05,2.95]){const l=new THREE.Mesh(new THREE.BoxGeometry(.12,.95,.12),legs);l.position.set(x,.47,z);scene.add(l)}
// distant party posters
function poster(x,z,color,text){
 const p=new THREE.Mesh(new THREE.PlaneGeometry(1.35,1.6),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.12,side:THREE.DoubleSide}));
 p.position.set(x,2.35,z);scene.add(p);
 const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;const ctx=canvas.getContext('2d');
 ctx.fillStyle='#171923';ctx.fillRect(0,0,256,256);ctx.fillStyle='#fff';ctx.font='bold 25px Arial';ctx.textAlign='center';ctx.fillText(text,128,135);
 const tex=new THREE.CanvasTexture(canvas);p.material=new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide});
}
poster(-5,-4.78,0x673f82,'PARTY!');poster(5,-4.78,0x9b3e43,'FUN TIME');
// animatronic silhouette at far end
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.85,5,8),mat(0x34333b));body.position.set(0,1.25,-3.8);scene.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.48,16,12),mat(0x45434b));head.position.set(0,2.05,-3.8);scene.add(head);
for(const x of [-.19,.19]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.075,12,8),new THREE.MeshBasicMaterial({color:0xff3b35}));eye.position.set(x,2.1,-3.36);scene.add(eye)}
// flashlight model, shown near lower right after pickup
const handGroup=new THREE.Group();camera.add(handGroup);scene.add(camera);
const grip=new THREE.Mesh(new THREE.CylinderGeometry(.09,.11,.55,12),mat(0x17191e));grip.rotation.z=-.25;grip.position.set(.43,-.42,-.8);handGroup.add(grip);
const headLamp=new THREE.Mesh(new THREE.CylinderGeometry(.14,.12,.2,12),mat(0x777d86));headLamp.rotation.z=-.25;headLamp.position.set(.39,-.29,-.91);handGroup.add(headLamp);
const lens=new THREE.Mesh(new THREE.CircleGeometry(.105,16),new THREE.MeshBasicMaterial({color:0xfff0c4}));lens.position.set(.409,-.29,-1.012);lens.rotation.y=Math.PI;handGroup.add(lens);
handGroup.visible=false;

const beam=new THREE.SpotLight(0xffe7b5,0,24,Math.PI/8,.35,1.4);
beam.position.set(0,0,0);beam.target.position.set(0,0,-1);camera.add(beam);camera.add(beam.target);
const ambientBeam=new THREE.PointLight(0xffe5b0,0,3);camera.add(ambientBeam);ambientBeam.position.set(.4,-.3,-.8);

let picked=false,on=false,battery=100,yaw=0,pitch=0,drag=false,lastX=0,lastY=0;
const status=document.querySelector('#status'),toggle=document.querySelector('#toggle'),pickup=document.querySelector('#pickup'),batteryEl=document.querySelector('#battery');
function updateUI(){
 toggle.textContent=on?'ВЫКЛЮЧИТЬ':'ВКЛЮЧИТЬ';
 toggle.disabled=!picked||battery<=0;
 pickup.textContent=picked?'ФОНАРИК ВЗЯТ':'ВЗЯТЬ ФОНАРИК';
 pickup.disabled=picked;
 status.textContent=!picked?'Фонарик лежит на столе':on?'Фонарик включён — свети на аниматроника':'Фонарик выключен';
 batteryEl.textContent='Энергия: '+Math.ceil(battery)+'%';
 beam.intensity=on?3.8:0;ambientBeam.intensity=on?.35:0;
 handGroup.visible=picked;
}
pickup.addEventListener('click',()=>{picked=true;updateUI()});
toggle.addEventListener('click',()=>{if(!picked||battery<=0)return;on=!on;updateUI()});
function down(e){drag=true;lastX=e.clientX;lastY=e.clientY}
function move(e){if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.004;pitch-=dy*.003;pitch=Math.max(-.85,Math.min(.75,pitch))}
function up(){drag=false}
renderer.domElement.addEventListener('pointerdown',down);
addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.code==='KeyF'&&picked){on=!on;updateUI()}});
let prev=performance.now();
function animate(now){
 requestAnimationFrame(animate);const dt=Math.min((now-prev)/1000,.05);prev=now;
 camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
 if(on){battery=Math.max(0,battery-dt*.55);if(battery===0)on=false;updateUI()}
 renderer.render(scene,camera);
}
updateUI();requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
